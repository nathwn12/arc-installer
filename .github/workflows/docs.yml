# Docs gate: strict phase-2 enforcement for this repository.
name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  docs:
    runs-on: windows-latest
    timeout-minutes: 10
    # No package.json or lockfile for docs-check.mjs, so no cache applies.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - name: Docs gate (strict mode)
        run: node scripts/docs-check.mjs --strict
